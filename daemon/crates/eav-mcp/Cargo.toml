[package]
name = "eav-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eav-server.workspace = true
eav-core.workspace = true
eav-index.workspace = true
eav-bridge.workspace = true
eav-agenda.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true

rmcp = { workspace = true }
schemars = { workspace = true }

# MCP uses its own axum 0.8 listener, separate from eav-server's axum 0.7 router.
# tower::Service from rmcp is served here; the two Routers never merge.
axum = { version = "0.8", features = ["macros"] }
